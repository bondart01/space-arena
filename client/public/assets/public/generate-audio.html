
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Space Arena Audio Generator</title>
</head>
<body>
  <h2>Space Arena — Audio Generator</h2>

  <button id="shoot">Download shoot.wav</button>
  <button id="hit">Download hit.wav</button>
  <button id="explosion">Download explosion.wav</button>

  <script>
    const sampleRate = 44100;

    function generateSound(type) {
      const duration =
        type === 'explosion' ? 0.7 : 0.25;

      const length = Math.floor(
        sampleRate * duration,
      );

      const samples = new Float32Array(length);

      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        const progress = t / duration;

        let value = 0;

        if (type === 'shoot') {
          const frequency = 900 - progress * 650;

          value =
            Math.sin(2 * Math.PI * frequency * t) *
            Math.pow(1 - progress, 2);
        }

        if (type === 'hit') {
          value =
            (Math.random() * 2 - 1) *
            Math.pow(1 - progress, 3);
        }

        if (type === 'explosion') {
          const noise = Math.random() * 2 - 1;

          const bass = Math.sin(
            2 * Math.PI * 65 * t,
          );

          value =
            (noise * 0.7 + bass * 0.3) *
            Math.pow(1 - progress, 2);
        }

        samples[i] = value * 0.45;
      }

      return samples;
    }

    function createWav(samples) {
      const buffer = new ArrayBuffer(
        44 + samples.length * 2,
      );

      const view = new DataView(buffer);

      function writeString(offset, text) {
        for (let i = 0; i < text.length; i++) {
          view.setUint8(
            offset + i,
            text.charCodeAt(i),
          );
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');

      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);

      writeString(36, 'data');
      view.setUint32(
        40,
        samples.length * 2,
        true,
      );

      for (let i = 0; i < samples.length; i++) {
        const sample = Math.max(
          -1,
          Math.min(1, samples[i]),
        );

        view.setInt16(
          44 + i * 2,
          sample * 32767,
          true,
        );
      }

      return new Blob([buffer], {
        type: 'audio/wav',
      });
    }

    function downloadSound(type) {
      const samples = generateSound(type);
      const wav = createWav(samples);

      const url = URL.createObjectURL(wav);

      const link = document.createElement('a');
      link.href = url;
      link.download = `${type}.wav`;
      link.click();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    document.querySelector('#shoot').onclick = () => {
      downloadSound('shoot');
    };

    document.querySelector('#hit').onclick = () => {
      downloadSound('hit');
    };

    document.querySelector('#explosion').onclick = () => {
      downloadSound('explosion');
    };
  </script>
</body>
</html>
