name: Space Arena CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:

permissions:
  contents: read

jobs:
  # ========================================
  # TEST AND BUILD
  # ========================================

  test-and-build:
    name: Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Determinism tests
        run: npm run test:determinism

      - name: Run unit tests
        run: npx vitest run

      - name: Check shared coverage
        run: npx vitest run --coverage shared

      - name: Build project
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test e2e/ --workers=1 --reporter=line

  # ========================================
  # DOCKER BUILD AND GHCR PUBLISH
  # ========================================

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest

    needs: test-and-build

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.final
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}